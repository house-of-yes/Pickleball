[project]
name = "Pickleball"
version = "0.1.0"
requires-python = ">=3.10"

[project.scripts]
Pickleball = "Pickleball.cli:app"
xcal = "Pickleball.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["Pickleball"]
package-dir = {"" = "."}

[tool.black]
line-length = 100
target-version = ["py310","py311","py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E","F","I","B","UP"]
ignore = []
exclude = ["__pycache__", ".git", ".mypy_cache", ".pytest_cache"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_optional = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
